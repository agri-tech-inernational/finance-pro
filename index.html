    <!-- Self-Healing Loader: Detects Asset 404s and forces a hard refresh -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
          console.warn('Asset Load Failure Detected. Forcing absolute refresh...');
          const lastReload = parseInt(localStorage.getItem('agritech_last_auto_reload') || '0');
          const now = Date.now();
          // Prevent infinite reload loops (max once every 10 seconds)
          if (now - lastReload > 10000) {
            localStorage.setItem('agritech_last_auto_reload', now.toString());
            window.location.reload(true);
          }
        }
      }, true);
    </script>
